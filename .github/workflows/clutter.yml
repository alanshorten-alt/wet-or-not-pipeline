name: Clutter mask collector
# Once a day, look at yesterday's radar. On days with genuinely dry hours (picked from Met Éireann's
# hourly composite) record which cells echo anyway, then rebuild a CANDIDATE clutter mask from every
# day collected so far. The live mask (pipeline/clutter_mask.json) is only ever changed by a reviewed PR.
# Met Éireann keeps about a week of archive, so a missed day is simply lost, not recoverable later.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "UTC day to collect, YYYY-MM-DD (default: yesterday)"
        required: false
  schedule:
    - cron: "40 5 * * *"
permissions:
  contents: write
concurrency:
  group: clutter
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Collect dry-hour echoes
        shell: bash
        run: |
          DAY="${{ github.event.inputs.day }}"
          if [ -z "$DAY" ]; then DAY=$(date -u -d yesterday +%F); fi
          python pipeline/validate_hours.py --cache "$RUNNER_TEMP/cache" --days "$DAY" --auto-dry \
            --save-echo pipeline/clutter_days | tee collect.log
      - name: Rebuild the candidate mask
        shell: bash
        run: |
          if [ -d pipeline/clutter_days ]; then
            python pipeline/validate_hours.py --combine pipeline/clutter_days --write-mask pipeline/clutter_mask_candidate.json | tee combine.log
          else
            echo "No dry hours collected yet."
          fi
      - name: Commit new data
        shell: bash
        run: |
          git config user.name "clutter-collector"
          git config user.email "clutter-collector@users.noreply.github.com"
          git add pipeline/clutter_days pipeline/clutter_mask_candidate.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new to commit."; else
            git commit -m "Clutter collector: echoes from dry hours"
            git push
          fi
