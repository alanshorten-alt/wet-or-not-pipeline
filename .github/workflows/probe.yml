name: Probe synoptic
on:
  push:
    branches: [probe-synoptic]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Observations CSV
        run: |
          curl -sS -m 30 -A "wet-or-not-pipeline" -D - -o obs.csv https://www.met.ie/latest-reports/observations/download | head -20
          head -40 obs.csv
      - name: Station list
        run: |
          curl -sS -m 30 -A "wet-or-not-pipeline" -D - -o st.txt "https://cli.fusio.net/cli/climate_data/webdata/StationDetails.csv" | head -5
          head -5 st.txt
